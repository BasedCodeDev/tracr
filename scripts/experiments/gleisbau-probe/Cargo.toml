[package]
name = "tracr-gleisbau-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["library"]
library = ["dep:gleisbau"]

[[bin]]
name = "tracr-gleisbau-probe"
path = "src/main.rs"
required-features = ["library"]

[dependencies]
gleisbau = { version = "=0.7.5", optional = true }
serde_json = "=1.0.140"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.0"

[profile.release]
strip = true
