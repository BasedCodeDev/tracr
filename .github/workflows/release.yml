name: Draft Linux release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (e.g. v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing tag and version
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git checkout --detach "$commit"
          ./scripts/release.sh check-tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: tracr-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: tracr-linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Install pinned Rust and musl
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$RELEASE_TARGET"
          rustup component add rust-docs
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils
      - name: Run full native checks
        run: ./scripts/check.sh
      - name: Build and test release binary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: ./scripts/release.sh build --target "$RELEASE_TARGET" --output release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
  draft:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tracr-linux-*
          path: downloaded
      - name: Assemble verified assets
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: ./scripts/release.sh assemble --tag "$RELEASE_TAG" --input downloaded --output dist
      # folder_check also exercises dev.sh offline; this fresh runner needs
      # the pinned toolchain, cached dependencies, and debug binary for that case.
      - name: Prepare development-launcher test prerequisite
        run: |
          rustup show
          cargo build --locked
      - name: Verify downloaded x86_64 assets and temporary installation
        run: ./scripts/release.sh verify --target x86_64-unknown-linux-musl --input dist
      - name: Create or refresh draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python3 scripts/draft_release.py "$RELEASE_TAG" dist
